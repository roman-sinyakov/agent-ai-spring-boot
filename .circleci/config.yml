version: 2.1

executors:
  maven:
    docker:
      - image: maven:3.9.11-eclipse-temurin-21
    environment: &maven-environment
      # MAJOR.MINOR is set here, PATCH is the CircleCI pipeline number
      REVISION: 1.0.<< pipeline.number >>
  maven-with-databases:
    docker:
      - image: maven:3.9.11-eclipse-temurin-21
      - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:590.0.1-emulators
        command: gcloud emulators firestore start --host-port=0.0.0.0:8081
      - image: postgres:18
        environment:
          POSTGRES_DB: persondb
          POSTGRES_USER: person
          POSTGRES_PASSWORD: person
    environment:
      <<: *maven-environment
      FIRESTORE_EMULATOR_HOST: localhost:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/persondb
      SPRING_DATASOURCE_USERNAME: person
      SPRING_DATASOURCE_PASSWORD: person

commands:
  with-maven-cache:
    parameters:
      steps:
        type: steps
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - steps: << parameters.steps >>
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

jobs:
  build:
    executor: maven-with-databases
    steps:
      - with-maven-cache:
          steps:
            - run:
                name: Wait for Firestore emulator and PostgreSQL
                command: |
                  for port in 8081 5432; do
                    timeout 180 bash -c "until echo > /dev/tcp/localhost/${port}; do sleep 2; done" 2>/dev/null
                  done
            - run:
                name: Verify
                command: mvn -B -Drevision=${REVISION} clean verify

  publish-image:
    executor: maven
    steps:
      - with-maven-cache:
          steps:
            - run:
                name: Build and push image to ghcr.io
                command: |
                  IMAGE=ghcr.io/${CIRCLE_PROJECT_USERNAME,,}/${CIRCLE_PROJECT_REPONAME}
                  mvn -B -Drevision=${REVISION} -DskipTests compile jib:build \
                    -Djib.to.image=${IMAGE}:${CIRCLE_SHA1} \
                    -Djib.to.tags=latest,${REVISION} \
                    -Djib.to.auth.username=${CIRCLE_PROJECT_USERNAME} \
                    -Djib.to.auth.password=${GHCR_TOKEN}

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger Render deploy
          command: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"

workflows:
  build-and-deploy:
    jobs:
      - build
      - publish-image:
          requires:
            - build
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - publish-image
          filters:
            branches:
              only: master
