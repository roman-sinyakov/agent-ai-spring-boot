version: 2.1

jobs:
  build:
    docker:
      - image: maven:3.9.11-eclipse-temurin-21
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Verify
          command: mvn -B clean verify
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

workflows:
  build:
    jobs:
      - build
