apiVersion: apps/v1
kind: Deployment
metadata:
  name: person-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: person-api
  template:
    metadata:
      labels:
        app: person-api
    spec:
      containers:
        - name: person-api
          image: agent-ai-spring-boot
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: person-api-secret
          # Firestore project and service account key, created manually (see README); not needed with PostgreSQL
          env:
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: firebase-credentials
                  key: project-id
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/firebase/firebase-key.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: firebase-credentials
          secret:
            secretName: firebase-credentials
            optional: true
