apiVersion: v1
kind: Secret
metadata:
  name: person-api-secret
type: Opaque
stringData:
  # Uncomment to use PostgreSQL instead of Firestore
  # SPRING_PROFILES_ACTIVE: postgres
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/persondb
  SPRING_DATASOURCE_USERNAME: person
  SPRING_DATASOURCE_PASSWORD: person
  APP_SECURITY_CLIENT_ID: person-api-client
  APP_SECURITY_CLIENT_SECRET: changeit
  APP_SECURITY_ISSUER: http://person-api:8080
