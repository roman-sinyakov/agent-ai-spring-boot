spring:
  datasource:
    url: jdbc:h2:mem:persondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

app:
  security:
    client-id: test-client
    client-secret: test-secret
    issuer: http://localhost:8080
