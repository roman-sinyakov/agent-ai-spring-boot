spring:
  autoconfigure:
    exclude: ""
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/persondb}
    username: ${SPRING_DATASOURCE_USERNAME:person}
    password: ${SPRING_DATASOURCE_PASSWORD:person}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
