server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-ai-spring-boot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/persondb}
    username: ${SPRING_DATASOURCE_USERNAME:person}
    password: ${SPRING_DATASOURCE_PASSWORD:person}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    client-id: ${APP_SECURITY_CLIENT_ID:person-api-client}
    client-secret: ${APP_SECURITY_CLIENT_SECRET:changeit}
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8080}
