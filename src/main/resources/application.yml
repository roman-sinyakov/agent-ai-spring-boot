server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-ai-spring-boot
  # PostgreSQL support is switched on with the "postgres" profile (application-postgres.yml)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    client-id: ${APP_SECURITY_CLIENT_ID:person-api-client}
    client-secret: ${APP_SECURITY_CLIENT_SECRET:changeit}
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8080}
  firestore:
    project-id: ${GOOGLE_CLOUD_PROJECT:agent-ai-spring-boot}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
